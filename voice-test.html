<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Fridge Voice Test</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3f3f3;color:#222}
  .wrap{max-width:760px;margin:0 auto;min-height:100vh;background:#fff;padding:28px 20px;display:flex;flex-direction:column;justify-content:center}
  h1{font-size:38px;margin:0 0 12px;text-align:center}
  p{font-size:20px;line-height:1.4;text-align:center;color:#666;margin:0 0 28px}
  button{width:100%;min-height:110px;border:0;border-radius:18px;font-size:30px;font-weight:700;background:#222;color:#fff;cursor:pointer;padding:20px}
  button:active{transform:scale(.99)}
  #status{margin-top:18px;text-align:center;font-size:18px;color:#555;min-height:26px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Fridge Voice Test</h1>
  <p>Tap the button below. If the fridge browser supports speech synthesis, it should speak out loud.</p>
  <button id="speakBtn">🔊 Speak</button>
  <div id="status"></div>
</div>
<script>
(function(){
  var btn=document.getElementById("speakBtn");
  var status=document.getElementById("status");
  function speak(){
    if(!("speechSynthesis" in window)){
      status.textContent="Speech synthesis is not supported in this browser.";
      return;
    }
    window.speechSynthesis.cancel();
    var utter=new SpeechSynthesisUtterance("Are you impressed yet, Jake?");
    utter.lang="en-GB";
    utter.rate=0.95;
    utter.pitch=1.0;
    utter.onstart=function(){status.textContent="Speaking…";};
    utter.onend=function(){status.textContent="Done.";};
    utter.onerror=function(){status.textContent="Speech failed in this browser.";};
    window.speechSynthesis.speak(utter);
  }
  btn.addEventListener("click",speak);
})();
</script>
</body>
</html>
